<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Runner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrapper">
    <div id="hud">
      <div class="hud-item">⭐ <span id="score">0</span></div>
      <div class="hud-item">❤️ <span id="lives">3</span></div>
      <div class="hud-item">⏱️ <span id="timer">0</span></div>
      <div class="hud-item">🌍 Level <span id="level">1</span></div>
    </div>
    <canvas id="game" width="960" height="540"></canvas>
    <div id="overlay" class="hidden">
      <h1 id="overlay-title">Pixel Runner</h1>
      <p id="overlay-message">Use arrow keys / WASD to move, Space to jump. Collect stars, avoid enemies, reach the flag!</p>
      <button id="start-btn">Start Game</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
